<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Tech Computer Solutions | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>
            <h1>Cape Tech Computer Solutions</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below and our team will respond
                to your enquiry.
            </p>

            <form id="enquiryForm">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Service Required:</label>

                <select id="service" name="service" required>
                    <option value="">Select a service</option>
                    <option value="computer-repairs">Computer Repairs</option>
                    <option value="laptop-sales">Laptop Sales</option>
                    <option value="software-installation">
                        Software Installation
                    </option>
                    <option value="network-setup">Network Setup</option>
                    <option value="cybersecurity">
                        Cybersecurity Support
                    </option>
                    <option value="it-consulting">IT Consulting</option>
                </select>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Cape Tech Computer Solutions. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
